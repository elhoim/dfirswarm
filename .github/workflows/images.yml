# The agents' VM images, built from the packs and booted — never pushed from
# here. A package published from this public repository becomes public
# (measured: the first push of these images could be pulled anonymously),
# and an image bundles separately licensed programs that are not ours to
# redistribute until each licence has been reviewed. Prebuilt images are
# published from the private dfirswarm-pro repository, to private packages.
#
# What this does instead: builds the base and every profile for amd64 from
# the recipes, `full` included, as a community user would (images/README.md),
# and memory and re for arm64 as well, on GitHub's arm64 runner: the arm64
# pins and the wheels arm64 has to compile are exercised nowhere else. A
# build fails when a program a pack requires is not in the image
# (install.py), and when a pinned download's sha256 is not what its pack
# says. Then each image is checked from the inside: its record holds the
# package lists a VM's inventory is diffed against at stop, and a fresh
# container diffs empty against them (scripts/vm.ts INVENTORY_SCRIPT, run
# as it is); its NOTICE and SBOM are there; data a pack pins (Volatility's
# Windows symbol tables) is on disk, indexed, and found with no network; and
# the programs a run once lacked work (tests/image-programs.sh: a C compiler,
# a planted AES key schedule found, a steghide round trip). CI's microVM job
# boots base and disk on a runner with KVM on every pull request;
# image-boot.yml boots every profile, and base on arm64 where the runner has
# KVM, once a week.
name: images

on:
  pull_request:
    paths:
      - images/**
      - packs/*/requires/**
      - packs/*/pack.json
      - tests/image-programs.sh
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build · ${{ matrix.profile }}${{ matrix.arch == 'arm64' && ' · arm64' || '' }}
    strategy:
      fail-fast: false
      matrix:
        profile: [base, re, memory, disk, network, linux, mobile, web, full]
        arch: [amd64]
        include:
          - { profile: memory, arch: arm64 }
          - { profile: re, arch: arm64 }
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      TAG: dev-${{ matrix.arch }}
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # For the inventory script only (scripts/vm.ts, node built-ins).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Build
        run: |
          docker build -f images/base.Dockerfile -t "dfirswarm-base:$TAG" images
          if [ "${{ matrix.profile }}" != base ]; then
            # Built here, never pushed: the flag is for this runner's copy.
            python3 images/recipe.py build "${{ matrix.profile }}" --out ctx --base "dfirswarm-base:$TAG" --allow-nonredistributable
            docker build -t "dfirswarm-${{ matrix.profile }}:$TAG" ctx
          fi
      - name: What the image holds, and that a fresh one diffs empty against its record
        run: |
          image="dfirswarm-${{ matrix.profile }}:$TAG"
          docker image inspect "$image" --format 'size: {{.Size}} bytes; redistributable label: {{index .Config.Labels "dev.dfirswarm.redistributable"}}'
          docker run --rm "$image" python3 -c 'import json; r = json.load(open("/etc/dfirswarm/image.json")); print(json.dumps({"profile": r.get("profile"), "packs": r.get("packs"), "redistributable": r.get("redistributable"), "binaries_found": sum(1 for v in (r.get("binaries") or {}).values() if v), "binaries": len(r.get("binaries") or {}), "not_installed": r.get("not_installed")}))'
          node --experimental-strip-types --no-warnings -e 'import("./scripts/vm.ts").then((m) => process.stdout.write(m.INVENTORY_SCRIPT))' > "$RUNNER_TEMP/inventory.py"
          out="$(docker run --rm -i "$image" python3 - < "$RUNNER_TEMP/inventory.py" | tail -1)"
          echo "inventory against the image's own record: $out"
          python3 -c 'import json, sys; d = json.loads(sys.argv[1]); sys.exit(0 if d.get("baseline") is True and d.get("apt") == {} and d.get("venv") == {} else 1)' "$out" \
            || { echo "a fresh container is not what its record says it is: $out" >&2; exit 1; }
          docker run --rm "$image" sh -c 'test -s /etc/dfirswarm/NOTICE && python3 -c "import json; b = json.load(open(\"/etc/dfirswarm/sbom.json\")); assert b[\"bomFormat\"] == \"CycloneDX\" and b[\"components\"]; print(\"sbom:\", len(b[\"components\"]), \"components\")"'
      - name: Pinned data is in the image, indexed, and found with no network
        run: |
          image="dfirswarm-${{ matrix.profile }}:$TAG"
          # Every data file a pack pins (a symbol pack) is on disk at the size the build recorded,
          # was warmed, and none a pack asked for was left out.
          docker run --rm "$image" python3 -c '
          import json, os, sys
          r = json.load(open("/etc/dfirswarm/image.json"))
          data = {k: v for k, v in (r.get("downloads") or {}).items() if v.get("kind") == "data"}
          left_out = (r.get("not_installed") or {}).get("data") or []
          bad = [k for k, v in data.items() if not os.path.isfile(v["path"]) or os.path.getsize(v["path"]) != v.get("bytes") or v.get("warm") == "failed"]
          print("pinned data:", {k: v.get("bytes") for k, v in data.items()}, "left out:", left_out, "bad:", bad)
          sys.exit(1 if left_out or bad else 0)'
          # Volatility lists the Windows symbol pack with no route out, from the index the build made.
          if docker run --rm "$image" sh -c 'command -v vol' >/dev/null 2>&1; then
            start="$(date +%s)"
            n="$(docker run --rm --network none "$image" sh -c 'vol -q isfinfo 2>/dev/null | grep -c "windows.zip!windows/"' || true)"
            echo "vol lists $n Windows symbol tables offline in $(( $(date +%s) - start )) s (container start included)"
            [ "${n:-0}" -ge 1000 ] || { echo "the Windows symbol pack is not found by vol with no network" >&2; exit 1; }
          fi
      - name: The programs a run asked for work in the image
        run: |
          # tests/image-programs.sh: a C program compiles and runs, a planted AES key schedule is found,
          # a message embedded with steghide comes back; a program the profile does not hold is skipped.
          docker run --rm -v "$PWD/tests:/t:ro" "dfirswarm-${{ matrix.profile }}:$TAG" sh /t/image-programs.sh
