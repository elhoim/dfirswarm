# The agents' VM images, built from the packs and booted — never pushed from
# here. A package published from this public repository becomes public
# (measured: the first push of these images could be pulled anonymously),
# and an image bundles separately licensed programs that are not ours to
# redistribute until each licence has been reviewed. Prebuilt images are
# published from the private dfirswarm-pro repository, to private packages.
#
# What this does instead: builds the base and every profile for amd64 from
# the recipes, `full` included, as a community user would (images/README.md),
# and prints what each image holds. A build fails when a program a pack
# requires is not in the image (install.py), and when a pinned download's
# sha256 is not what its pack says. CI's microVM job boots base and disk on a
# runner with KVM.
name: images

on:
  pull_request:
    paths:
      - images/**
      - packs/*/requires/**
      - packs/*/pack.json
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build · ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: [base, re, memory, disk, network, linux, mobile, web, full]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - name: Build
        run: |
          docker build -f images/base.Dockerfile -t dfirswarm-base:dev-amd64 images
          if [ "${{ matrix.profile }}" != base ]; then
            # Built here, never pushed: the flag is for this runner's copy.
            python3 images/recipe.py build "${{ matrix.profile }}" --out ctx --base dfirswarm-base:dev-amd64 --allow-nonredistributable
            docker build -t "dfirswarm-${{ matrix.profile }}:dev-amd64" ctx
          fi
          docker run --rm "dfirswarm-${{ matrix.profile }}:dev-amd64" python3 -c 'import json; r = json.load(open("/etc/dfirswarm/image.json")); print(json.dumps({"profile": r.get("profile"), "packs": r.get("packs"), "binaries_found": sum(1 for v in (r.get("binaries") or {}).values() if v), "binaries": len(r.get("binaries") or {}), "not_installed": r.get("not_installed")}))'
